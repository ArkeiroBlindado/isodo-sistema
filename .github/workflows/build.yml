on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses5-dev libssl-dev \
          sed make binutils g++ bash patch gzip bzip2 perl tar cpio \
          unzip rsync file bc wget qtbase5-dev qtgstreamer-plugins-qt5 \
          python3 python3-flake8 flake8 python3-setuptools git

    - name: Restore Buildroot Cache
      uses: actions/cache/restore@v4
      with:
        path: |
          buildroot/dl
          buildroot/output/ccache
        key: br-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          br-cache-${{ runner.os }}-

    - name: Download Buildroot
      run: |
        git clone --depth 1 --branch 2024.02.x https://github.com/buildroot/buildroot.git

    - name: Configure Buildroot for Anbernic RG35XX H
      run: |
        cd buildroot
        
        cat <<EOF > configs/anbernic_rg35xx_h_defconfig
        BR2_aarch64=y
        BR2_cortex_a53=y
        BR2_ARM_FPU_VFPV4=y
        BR2_TOOLCHAIN_BUILDROOT_WCHAR=y
        BR2_TOOLCHAIN_BUILDROOT_CXX=y
        BR2_TOOLCHAIN_HAS_THREADS=y
        BR2_TOOLCHAIN_HAS_THREADS_NPTL=y
        BR2_TARGET_ROOTFS_EXT2=y
        BR2_TARGET_ROOTFS_EXT2_4=y
        BR2_PACKAGE_HOST_GENIMAGE=y
        BR2_PACKAGE_HOST_DOSFSTOOLS=y
        BR2_PACKAGE_HOST_MTOOLS=y
        BR2_CCACHE=y
        BR2_CCACHE_DIR="\$(O)/ccache"
        BR2_LINUX_KERNEL=y
        BR2_LINUX_KERNEL_CUSTOM_TARBALL=y
        BR2_LINUX_KERNEL_CUSTOM_TARBALL_LOCATION="https://github.com/rg35xx-cfw/linux/archive/refs/heads/rg35xx-h-mainline.tar.gz"
        BR2_LINUX_KERNEL_DEFCONFIG="sunxi"
        BR2_LINUX_KERNEL_DTS_SUPPORT=y
        BR2_LINUX_KERNEL_INTREE_DTS_NAME="allwinner/sun50i-h700-anbernic-rg35xx-h"
        BR2_LINUX_KERNEL_INSTALL_TARGET=y
        BR2_PACKAGE_LINUX_FIRMWARE=y
        BR2_PACKAGE_LINUX_FIRMWARE_RTL_88XX=y
        BR2_PACKAGE_RTL8821CS=y
        BR2_PACKAGE_IW=y
        BR2_PACKAGE_WPA_SUPPLICANT=y
        BR2_PACKAGE_WPA_SUPPLICANT_NL80211=y
        BR2_PACKAGE_WPA_SUPPLICANT_CLI=y
        BR2_PACKAGE_WIRELESS_TOOLS=y
        BR2_PACKAGE_BLUEZ5_UTILS=y
        BR2_PACKAGE_BLUEZ5_UTILS_CLIENT=y
        BR2_PACKAGE_EVTEST=y
        BR2_PACKAGE_LIBEVDEV=y
        BR2_PACKAGE_INPUT_TOOLS=y
        BR2_PACKAGE_TRIGGERHAPPY=y
        BR2_PACKAGE_XKEYBOARD_CONFIG=y
        EOF
        
        make anbernic_rg35xx_h_defconfig

    - name: Script de Customizacao
      run: |
        mkdir -p buildroot/board/anbernic/rg35xx_h/rootfs_overlay/etc/wpa_supplicant
        mkdir -p buildroot/board/anbernic/rg35xx_h/rootfs_overlay/etc/init.d
        mkdir -p buildroot/board/anbernic/rg35xx_h/rootfs_overlay/etc/triggerhappy/triggers.d
        mkdir -p buildroot/board/anbernic/rg35xx_h/rootfs_overlay/usr/bin
        
        cat <<EOF > buildroot/board/anbernic/rg35xx_h/rootfs_overlay/etc/wpa_supplicant/wpa_supplicant.conf
        ctrl_interface=/var/run/wpa_supplicant
        update_config=1
        country=BR
        EOF

        cat <<EOF > buildroot/board/anbernic/rg35xx_h/rootfs_overlay/etc/init.d/S40bluetooth
        #!/bin/sh
        case "\$1" in
          start)
                printf "Iniciando Bluetooth... "
                hciattach /dev/ttyS1 any 115200 flow
                hciconfig hci0 up
                /usr/libexec/bluetooth/bluetoothd -n &
                echo "OK"
                ;;
          stop)
                killall bluetoothd
                hciconfig hci0 down
                ;;
          *)
                echo "Uso: \$0 {start|stop}"
                exit 1
        esac
        exit 0
        EOF
        chmod +x buildroot/board/anbernic/rg35xx_h/rootfs_overlay/etc/init.d/S40bluetooth

        cat <<EOF > buildroot/board/anbernic/rg35xx_h/rootfs_overlay/etc/triggerhappy/triggers.d/buttons.conf
        KEY_VOLUMEUP     1    /usr/bin/amixer set Master 5%+
        KEY_VOLUMEDOWN   1    /usr/bin/amixer set Master 5%-
        KEY_HOMEPAGE     1    /usr/bin/virtual_keyboard_toggle.sh
        EOF

        cat <<EOF > buildroot/board/anbernic/rg35xx_h/rootfs_overlay/usr/bin/virtual_keyboard_toggle.sh
        #!/bin/sh
        if pgrep -x "uinput" > /dev/null; then
            killall virtual_keyboard_program 2>/dev/null
        else
            echo "Teclado virtual ativo"
        fi
        EOF
        chmod +x buildroot/board/anbernic/rg35xx_h/rootfs_overlay/usr/bin/virtual_keyboard_toggle.sh

        cat <<EOF > buildroot/board/anbernic/rg35xx_h/genimage.cfg
        image boot.vfat {
          vfat { files = { "Image", "sun50i-h700-anbernic-rg35xx-h.dtb" } }
          size = 64M
        }
        image sdcard.img {
          hdimage {}
          partition u-boot { in-partition-table = "no"; image = "u-boot.bin"; offset = 8K; }
          partition boot { partition-type = 0xC; bootable = "true"; image = "boot.vfat"; }
          partition rootfs { partition-type = 0x83; image = "rootfs.ext4"; }
        }
        EOF
        
        cat <<EOF > buildroot/board/anbernic/rg35xx_h/post-image.sh
        #!/bin/sh
        BOARD_DIR="\$(dirname \$0)"
        GENIMAGE_CFG="\${BOARD_DIR}/genimage.cfg"
        GENIMAGE_TMP="\${BUILD_DIR}/genimage.tmp"
        rm -rf "\${GENIMAGE_TMP}"
        genimage --config "\${GENIMAGE_CFG}" --rootpath "\${TARGET_DIR}" --tmppath "\${GENIMAGE_TMP}" --inputpath "\${BINARIES_DIR}" --outputpath "\${BINARIES_DIR}"
        EOF
        chmod +x buildroot/board/anbernic/rg35xx_h/post-image.sh
        
        echo 'BR2_ROOTFS_POST_IMAGE_SCRIPT="board/anbernic/rg35xx_h/post-image.sh"' >> buildroot/.config
        echo 'BR2_ROOTFS_OVERLAY="board/anbernic/rg35xx_h/rootfs_overlay"' >> buildroot/.config
        cd buildroot && make olddefconfig

    - name: Compile OS (Buildroot Make)
      run: |
        cd buildroot
        make -j$(nproc)

    - name: Save Buildroot Cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          buildroot/dl
          buildroot/output/ccache
        key: br-cache-${{ runner.os }}-${{ github.sha }}

    - name: Upload SD Card Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rg35xx-h-full-system-image
        path: buildroot/output/images/sdcard.img
        if-no-files-found: error
        retention-days: 7
